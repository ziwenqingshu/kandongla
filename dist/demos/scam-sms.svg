<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 812" width="375" height="812">
  <!-- Background -->
  <rect width="375" height="812" fill="#FFF"/>
  <!-- Status bar -->
  <rect width="375" height="44" fill="#F7F7F7"/>
  <text x="187" y="30" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#000">9:41</text>
  <text x="30" y="30" font-family="sans-serif" font-size="13" fill="#000">中国移动</text>
  <rect x="310" y="18" width="22" height="11" rx="2" fill="none" stroke="#000" stroke-width="1.2"/>
  <rect x="312" y="20" width="16" height="7" rx="1" fill="#000"/>

  <!-- Nav bar -->
  <rect y="44" width="375" height="50" fill="#F7F7F7"/>
  <text x="24" y="75" font-family="sans-serif" font-size="22" fill="#000">&lt;</text>
  <text x="187" y="76" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="600" fill="#000">10086</text>
  <line x1="0" y1="94" x2="375" y2="94" stroke="#E0E0E0" stroke-width="0.5"/>

  <!-- SMS content area -->
  <rect y="94" width="375" height="662" fill="#F0F0F0"/>

  <!-- Time stamp -->
  <text x="187" y="125" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#999">今天 14:23</text>

  <!-- Incoming message bubble -->
  <rect x="16" y="140" width="280" height="260" rx="12" fill="#FFF"/>
  <!-- Small triangle -->
  <polygon points="16,160 8,165 16,170" fill="#FFF"/>

  <text x="30" y="168" font-family="sans-serif" font-size="15" fill="#333">
    <tspan x="30" dy="0">【淘宝客服】尊敬的用户，</tspan>
    <tspan x="30" dy="24">您近期购买的商品存在质量</tspan>
    <tspan x="30" dy="24">问题，我们将为您办理双倍</tspan>
    <tspan x="30" dy="24">退款理赔。请点击链接</tspan>
    <tspan x="30" dy="24" fill="#1677FF">http://tb.cn/Rf8x.k3f</tspan>
    <tspan x="30" dy="24">填写银行卡信息完成退款，</tspan>
    <tspan x="30" dy="24">24小时内未办理将自动扣款。</tspan>
  </text>

  <!-- Warning icon in message -->
  <text x="30" y="390" font-family="sans-serif" font-size="12" fill="#FF4D4F">⚠ 该链接来自陌生号码</text>

  <!-- Self message -->
  <rect x="100" y="420" width="260" height="50" rx="12" fill="#95EC69"/>
  <text x="115" y="450" font-family="sans-serif" font-size="15" fill="#000">好的，我点进去看看</text>

  <!-- Incoming reply -->
  <rect x="16" y="490" width="260" height="80" rx="12" fill="#FFF"/>
  <text x="30" y="518" font-family="sans-serif" font-size="15" fill="#333">
    <tspan x="30" dy="0">请尽快操作，逾期退款将</tspan>
    <tspan x="30" dy="24">自动失效。需要帮助请回复1</tspan>
  </text>

  <!-- Input bar -->
  <rect y="700" width="375" height="56" fill="#F7F7F7"/>
  <line x1="0" y1="700" x2="375" y2="700" stroke="#E0E0E0" stroke-width="0.5"/>
  <rect x="16" y="710" width="280" height="36" rx="6" fill="#FFF" stroke="#E0E0E0" stroke-width="1"/>
  <text x="30" y="733" font-family="sans-serif" font-size="14" fill="#CCC">输入短信内容...</text>
  <rect x="310" y="710" width="50" height="36" rx="6" fill="#07C160"/>
  <text x="335" y="733" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#FFF">发送</text>

  <!-- Bottom bar -->
  <rect y="756" width="375" height="56" fill="#F7F7F7"/>
</svg>