<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 812" width="375" height="812">
  <!-- Background - dark chat background -->
  <rect width="375" height="812" fill="#1A1A2E"/>

  <!-- Status bar -->
  <rect width="375" height="44" fill="#1A1A2E"/>
  <text x="187" y="30" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#FFF">9:41</text>
  <text x="30" y="30" font-family="sans-serif" font-size="13" fill="#FFF">中国移动</text>
  <rect x="310" y="18" width="22" height="11" rx="2" fill="none" stroke="#FFF" stroke-width="1.2"/>
  <rect x="312" y="20" width="16" height="7" rx="1" fill="#FFF"/>

  <!-- Chat header -->
  <rect y="44" width="375" height="50" fill="#16213E"/>
  <text x="24" y="75" font-family="sans-serif" font-size="22" fill="#FFF">&lt;</text>
  <circle cx="170" cy="69" r="14" fill="#E94560"/>
  <text x="170" y="74" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#FFF">客</text>
  <text x="200" y="75" font-family="sans-serif" font-size="17" font-weight="500" fill="#FFF">客服小王</text>
  <line x1="0" y1="94" x2="375" y2="94" stroke="#2A2A4A" stroke-width="0.5"/>

  <!-- Chat messages -->
  <!-- Other person message -->
  <rect x="16" y="110" width="240" height="50" rx="12" fill="#2A2A4A"/>
  <text x="30" y="140" font-family="sans-serif" font-size="15" fill="#E0E0E0">您好，我是XX平台客服小王</text>

  <rect x="16" y="175" width="280" height="70" rx="12" fill="#2A2A4A"/>
  <text x="30" y="200" font-family="sans-serif" font-size="15" fill="#E0E0E0">
    <tspan x="30" dy="0">您的订单有问题需要退款，</tspan>
    <tspan x="30" dy="22">请您下载"云会议"APP</tspan>
  </text>

  <rect x="16" y="260" width="300" height="70" rx="12" fill="#2A2A4A"/>
  <text x="30" y="285" font-family="sans-serif" font-size="15" fill="#E0E0E0">
    <tspan x="30" dy="0">开启共享屏幕功能，我手把手</tspan>
    <tspan x="30" dy="22">教您操作退款，很简单的😊</tspan>
  </text>

  <!-- Self message -->
  <rect x="100" y="350" width="260" height="50" rx="12" fill="#95EC69"/>
  <text x="115" y="380" font-family="sans-serif" font-size="15" fill="#000">好的，我下载试试看</text>

  <!-- Screen sharing request popup -->
  <rect x="20" y="420" width="335" height="310" rx="16" fill="#FFF"/>

  <!-- Red warning header -->
  <rect x="20" y="420" width="335" height="60" rx="16" fill="#FF4D4F"/>
  <rect x="20" y="460" width="335" height="20" fill="#FF4D4F"/>
  <text x="187" y="458" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#FFF">⚠️ 共享屏幕请求</text>

  <!-- Warning content -->
  <text x="187" y="510" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="600" fill="#333">"客服小王" 请求共享您的屏幕</text>

  <text x="45" y="545" font-family="sans-serif" font-size="14" fill="#666">
    <tspan x="45" dy="0">对方将能看到您手机上的</tspan>
    <tspan x="45" dy="24">所有内容，包括：</tspan>
  </text>

  <!-- List of visible items -->
  <text x="60" y="605" font-family="sans-serif" font-size="14" fill="#FF4D4F">• 银行卡号、密码</text>
  <text x="60" y="630" font-family="sans-serif" font-size="14" fill="#FF4D4F">• 短信验证码</text>
  <text x="60" y="655" font-family="sans-serif" font-size="14" fill="#FF4D4F">• 微信聊天记录</text>

  <!-- Buttons -->
  <rect x="40" y="680" width="140" height="40" rx="8" fill="#F0F0F0"/>
  <text x="110" y="705" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="500" fill="#666">拒绝</text>

  <rect x="195" y="680" width="140" height="40" rx="8" fill="#FF4D4F"/>
  <text x="265" y="705" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="500" fill="#FFF">允许共享</text>
</svg>