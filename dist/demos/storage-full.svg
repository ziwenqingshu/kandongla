<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 812" width="375" height="812">
  <!-- Background - home screen -->
  <defs>
    <linearGradient id="homeBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#667EEA"/>
      <stop offset="100%" stop-color="#764BA2"/>
    </linearGradient>
  </defs>
  <rect width="375" height="812" fill="url(#homeBg)"/>

  <!-- Status bar -->
  <text x="187" y="30" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#FFF">9:41</text>
  <text x="30" y="30" font-family="sans-serif" font-size="13" fill="#FFF">中国移动</text>
  <rect x="310" y="18" width="22" height="11" rx="2" fill="none" stroke="#FFF" stroke-width="1.2"/>
  <rect x="312" y="20" width="16" height="7" rx="1" fill="#FFF"/>

  <!-- Home screen app icons (simplified) -->
  <!-- Row 1 -->
  <rect x="30" y="80" width="60" height="60" rx="14" fill="#07C160"/>
  <text x="60" y="118" text-anchor="middle" font-family="sans-serif" font-size="24">💬</text>
  <text x="60" y="155" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#FFF">微信</text>

  <rect x="112" y="80" width="60" height="60" rx="14" fill="#1677FF"/>
  <text x="142" y="118" text-anchor="middle" font-family="sans-serif" font-size="24">📱</text>
  <text x="142" y="155" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#FFF">支付宝</text>

  <rect x="194" y="80" width="60" height="60" rx="14" fill="#FF6B35"/>
  <text x="224" y="118" text-anchor="middle" font-family="sans-serif" font-size="24">🛒</text>
  <text x="224" y="155" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#FFF">淘宝</text>

  <rect x="276" y="80" width="60" height="60" rx="14" fill="#FA5151"/>
  <text x="306" y="118" text-anchor="middle" font-family="sans-serif" font-size="24">📰</text>
  <text x="306" y="155" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#FFF">头条</text>

  <!-- Row 2 -->
  <rect x="30" y="175" width="60" height="60" rx="14" fill="#4C83F7"/>
  <text x="60" y="213" text-anchor="middle" font-family="sans-serif" font-size="24">📷</text>
  <text x="60" y="250" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#FFF">相机</text>

  <rect x="112" y="175" width="60" height="60" rx="14" fill="#34C759"/>
  <text x="142" y="213" text-anchor="middle" font-family="sans-serif" font-size="24">🗺️</text>
  <text x="142" y="250" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#FFF">地图</text>

  <rect x="194" y="175" width="60" height="60" rx="14" fill="#FF9500"/>
  <text x="224" y="213" text-anchor="middle" font-family="sans-serif" font-size="24">🎵</text>
  <text x="224" y="250" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#FFF">音乐</text>

  <rect x="276" y="175" width="60" height="60" rx="14" fill="#AF52DE"/>
  <text x="306" y="213" text-anchor="middle" font-family="sans-serif" font-size="24">⚙️</text>
  <text x="306" y="250" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#FFF">设置</text>

  <!-- Semi-transparent overlay -->
  <rect width="375" height="812" fill="rgba(0,0,0,0.45)" rx="0"/>

  <!-- Storage warning dialog -->
  <rect x="30" y="280" width="315" height="300" rx="20" fill="#FFF"/>

  <!-- Warning icon -->
  <circle cx="187" cy="320" r="28" fill="#FFF3E0"/>
  <text x="187" y="330" text-anchor="middle" font-family="sans-serif" font-size="30">⚠️</text>

  <!-- Dialog title -->
  <text x="187" y="375" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#333">iPhone 存储空间不足</text>

  <!-- Storage bar -->
  <rect x="55" y="395" width="265" height="16" rx="8" fill="#E5E5E5"/>
  <rect x="55" y="395" width="250" height="16" rx="8" fill="#FF3B30"/>
  <text x="187" y="430" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#666">128 GB 中已使用 126.5 GB</text>

  <!-- Dialog content -->
  <text x="187" y="460" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#666">
    <tspan x="187" dy="0">存储空间已满，无法拍照、</tspan>
    <tspan x="187" dy="22">接收消息和更新应用。</tspan>
  </text>

  <!-- Buttons -->
  <rect x="55" y="505" width="265" height="44" rx="10" fill="#007AFF"/>
  <text x="187" y="533" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="600" fill="#FFF">管理存储空间</text>

  <text x="187" y="565" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#007AFF">稍后处理</text>

  <!-- Home indicator -->
  <rect x="122" y="790" width="130" height="5" rx="2.5" fill="rgba(255,255,255,0.5)"/>
</svg>