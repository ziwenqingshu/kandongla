<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 812" width="375" height="812">
  <defs>
    <linearGradient id="statusBar1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EDEDED"/>
      <stop offset="100%" stop-color="#EDEDED"/>
    </linearGradient>
  </defs>
  <!-- Phone background -->
  <rect width="375" height="812" fill="#EDEDED" rx="0"/>
  <!-- Status bar -->
  <rect width="375" height="44" fill="#EDEDED"/>
  <text x="187" y="30" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#000">9:41</text>
  <text x="30" y="30" font-family="sans-serif" font-size="13" fill="#000">中国移动</text>
  <!-- Battery/signal icons -->
  <rect x="310" y="18" width="22" height="11" rx="2" fill="none" stroke="#000" stroke-width="1.2"/>
  <rect x="312" y="20" width="16" height="7" rx="1" fill="#000"/>
  <rect x="332" y="22" width="2" height="5" rx="1" fill="#000"/>
  <!-- Signal bars -->
  <rect x="280" y="25" width="3" height="4" rx="0.5" fill="#000"/>
  <rect x="285" y="22" width="3" height="7" rx="0.5" fill="#000"/>
  <rect x="290" y="19" width="3" height="10" rx="0.5" fill="#000"/>
  <rect x="295" y="16" width="3" height="13" rx="0.5" fill="#000"/>

  <!-- WeChat nav bar -->
  <rect y="44" width="375" height="50" fill="#EDEDED"/>
  <text x="187" y="75" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="600" fill="#000">微信(3)</text>
  <line x1="0" y1="94" x2="375" y2="94" stroke="#D9D9D9" stroke-width="0.5"/>
  <!-- Search icon -->
  <circle cx="340" cy="69" r="10" fill="none" stroke="#000" stroke-width="1.5"/>
  <line x1="347" y1="76" x2="353" y2="82" stroke="#000" stroke-width="1.5"/>
  <!-- Add icon -->
  <circle cx="305" cy="69" r="12" fill="none" stroke="#000" stroke-width="1.5"/>
  <line x1="299" y1="69" x2="311" y2="69" stroke="#000" stroke-width="1.5"/>
  <line x1="305" y1="63" x2="305" y2="75" stroke="#000" stroke-width="1.5"/>

  <!-- Chat list -->
  <!-- Chat 1: File Helper -->
  <rect y="94" width="375" height="76" fill="#FFF"/>
  <rect x="16" y="106" width="50" height="50" rx="6" fill="#4C83F7"/>
  <text x="41" y="137" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#FFF">文件</text>
  <text x="78" y="124" font-family="sans-serif" font-size="17" font-weight="500" fill="#000">文件传输助手</text>
  <text x="78" y="148" font-family="sans-serif" font-size="14" fill="#999">[图片]</text>
  <text x="335" y="120" font-family="sans-serif" font-size="12" fill="#B2B2B2">下午 2:30</text>
  <line x1="78" y1="170" x2="375" y2="170" stroke="#F0F0F0" stroke-width="0.5"/>

  <!-- Chat 2: Family group -->
  <rect y="170" width="375" height="76" fill="#FFF"/>
  <rect x="16" y="182" width="50" height="50" rx="6" fill="#FA9D3B"/>
  <text x="41" y="213" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#FFF">家人</text>
  <text x="78" y="200" font-family="sans-serif" font-size="17" font-weight="500" fill="#000">相亲相爱一家人</text>
  <text x="78" y="224" font-family="sans-serif" font-size="14" fill="#999">妈妈: 今天天气不错</text>
  <text x="335" y="196" font-family="sans-serif" font-size="12" fill="#B2B2B2">上午 11:20</text>
  <circle cx="345" cy="218" r="10" fill="#FA5151"/>
  <text x="345" y="222" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#FFF">2</text>
  <line x1="78" y1="246" x2="375" y2="246" stroke="#F0F0F0" stroke-width="0.5"/>

  <!-- Chat 3: WeChat Team -->
  <rect y="246" width="375" height="76" fill="#FFF"/>
  <rect x="16" y="258" width="50" height="50" rx="6" fill="#57C274"/>
  <text x="41" y="289" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="600" fill="#FFF">团队</text>
  <text x="78" y="276" font-family="sans-serif" font-size="17" font-weight="500" fill="#000">微信团队</text>
  <text x="78" y="300" font-family="sans-serif" font-size="14" fill="#999">有新版本可用啦~</text>
  <text x="335" y="272" font-family="sans-serif" font-size="12" fill="#B2B2B2">昨天</text>
  <line x1="78" y1="322" x2="375" y2="322" stroke="#F0F0F0" stroke-width="0.5"/>

  <!-- Chat 4 -->
  <rect y="322" width="375" height="76" fill="#FFF"/>
  <rect x="16" y="334" width="50" height="50" rx="6" fill="#7B68EE"/>
  <text x="41" y="365" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#FFF">小李</text>
  <text x="78" y="352" font-family="sans-serif" font-size="17" font-weight="500" fill="#000">李小明</text>
  <text x="78" y="376" font-family="sans-serif" font-size="14" fill="#999">好的，周末见！</text>
  <text x="335" y="348" font-family="sans-serif" font-size="12" fill="#B2B2B2">周二</text>
  <line x1="78" y1="398" x2="375" y2="398" stroke="#F0F0F0" stroke-width="0.5"/>

  <!-- Remaining chats faded -->
  <rect y="398" width="375" height="76" fill="#FFF"/>
  <rect x="16" y="410" width="50" height="50" rx="6" fill="#E8B84C"/>
  <text x="78" y="428" font-family="sans-serif" font-size="17" font-weight="500" fill="#000">社区通知群</text>
  <text x="78" y="452" font-family="sans-serif" font-size="14" fill="#999">明天下午3点停电通知</text>

  <!-- Semi-transparent overlay -->
  <rect width="375" height="812" fill="rgba(0,0,0,0.4)"/>

  <!-- Update dialog -->
  <rect x="40" y="260" width="295" height="290" rx="16" fill="#FFF"/>
  <!-- Dialog icon -->
  <rect x="147" y="240" width="80" height="80" rx="16" fill="#07C160"/>
  <text x="187" y="290" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="700" fill="#FFF">微信</text>
  <!-- Dialog title -->
  <text x="187" y="350" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="600" fill="#000">微信新版本更新</text>
  <!-- Dialog content -->
  <text x="187" y="380" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#666">版本 8.0.44</text>
  <text x="187" y="405" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#666">修复了一些已知问题</text>
  <text x="187" y="425" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#666">提升了使用体验</text>
  <!-- Update button -->
  <rect x="65" y="450" width="245" height="44" rx="8" fill="#07C160"/>
  <text x="187" y="478" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="600" fill="#FFF">立即更新</text>
  <!-- Later button -->
  <text x="187" y="520" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#999">稍后</text>

  <!-- Bottom tab bar -->
  <rect y="756" width="375" height="56" fill="#F7F7F7"/>
  <line x1="0" y1="756" x2="375" y2="756" stroke="#E0E0E0" stroke-width="0.5"/>
  <!-- Tab icons (simplified) -->
  <rect x="35" y="766" width="24" height="20" rx="3" fill="#07C160"/>
  <text x="47" y="800" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#07C160">微信</text>
  <rect x="125" y="766" width="24" height="20" rx="3" fill="#C0C0C0"/>
  <text x="137" y="800" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#999">通讯录</text>
  <rect x="215" y="766" width="24" height="20" rx="3" fill="#C0C0C0"/>
  <text x="227" y="800" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#999">发现</text>
  <rect x="305" y="766" width="24" height="20" rx="3" fill="#C0C0C0"/>
  <text x="317" y="800" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#999">我</text>
</svg>